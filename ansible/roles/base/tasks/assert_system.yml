---
# roles/base/tasks/assert_system.yml

- name: Check for cloud-image marker
  ansible.builtin.stat:
    path: /etc/cloud/build.info
  register: base_cloud_build_info

- name: Check for initialized cloud-init instance
  ansible.builtin.stat:
    path: /var/lib/cloud/instance
    follow: true
  register: base_cloud_instance

- name: Require an Ubuntu cloud-init system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - >-
        (base_cloud_build_info.stat.isreg | default(false)) or
        (base_cloud_instance.stat.isdir | default(false))
    fail_msg: >-
      Expected Ubuntu with a cloud-image marker or an initialized
      cloud-init instance.
