---
# ansible/roles/base/tasks/main.yml

- name: Assert Ubuntu Server Image
  ansible.builtin.import_tasks: assert_system.yml

- name: Set timezone
  community.general.timezone:
    name: "{{ server_timezone }}"

- name: Discover installed services
  ansible.builtin.service_facts:

- name: Require a supported time synchronization service
  ansible.builtin.assert:
    that:
      - >-
        'chrony.service' in ansible_facts.services or
        'systemd-timesyncd.service' in ansible_facts.services
    fail_msg: Neither Chrony nor systemd-timesyncd is installed.

- name: Enable time synchronization
  ansible.builtin.systemd_service:
    name: >-
      {{ 'chrony.service'
         if 'chrony.service' in ansible_facts.services
         else 'systemd-timesyncd.service' }}
    state: started
    enabled: true

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Configure UTF-8
  ansible.builtin.import_tasks: utf8.yml

- name: Perform package tasks
  ansible.builtin.import_tasks: packages.yml

- name: Configure unattended-upgrades
  ansible.builtin.import_tasks: unattended-upgrades.yml

- name: Perform unit file tasks
  ansible.builtin.import_tasks: units.yml

- name: Configure journald
  ansible.builtin.import_tasks: journald.yml
