---
# ansible/roles/base/tasks/main.yml

- name: Set timezone
  community.general.timezone:
    name: "{{ server_timezone }}"

- name: Enable time synchronization
  ansible.builtin.systemd_service:
    name: systemd-timesyncd.service
    state: started
    enabled: true

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ server_hostname }}"

- name: Configure UTF-8
  ansible.builtin.import_tasks: utf8.yml

- name: Perform package tasks
  ansible.builtin.import_tasks: packages.yml

- name: Configure unattended-upgrades
  ansible.builtin.import_tasks: unattended-upgrades.yml

- name: Perform unit file tasks
  ansible.builtin.import_tasks: units.yml

- name: Configure journald
  ansible.builtin.import_tasks: journald.yml
