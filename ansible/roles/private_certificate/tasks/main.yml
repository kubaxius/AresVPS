---
# ansible/roles/private_certificate/tasks/main.yml

- name: Install Certbot and Cloudflare DNS plugin
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present
    update_cache: true

- name: Store Cloudflare DNS credential
  ansible.builtin.copy:
    dest: /etc/letsencrypt/cloudflare.ini
    content: "dns_cloudflare_api_token = {{ vault_cloudflare_dns_api_token }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Enable Certbot renewal timer
  ansible.builtin.systemd_service:
    name: certbot.timer
    enabled: true
    state: started

- name: Issue private wildcard certificate
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --non-interactive
      - --agree-tos
      - --email
      - "{{ certificate_email }}"
      - --dns-cloudflare
      - --dns-cloudflare-credentials
      - /etc/letsencrypt/cloudflare.ini
      - --dns-cloudflare-propagation-seconds
      - "60"
      - --cert-name
      - pan.bearworks.pl
      - -d
      - "*.pan.bearworks.pl"
    creates: /etc/letsencrypt/renewal/pan.bearworks.pl.conf
  when: private_certificate_issue | default(false) | bool
