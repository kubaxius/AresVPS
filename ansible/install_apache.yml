---
- name: Test play
  hosts: all
  become: true
  tasks:
    - name: Print message
      ansible.builtin.debug:
        msg: "This is {{ ansible_facts['distribution'] }}!"
      when: ansible_facts["distribution"] in ["Ubuntu", "Debian"]

    - name: Update repository index
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts["distribution"] == "Ubuntu"
    - name: Install apache2 package
      ansible.builtin.apt:
        name: apache2
        state: present
    - name: Add php support for apache2
      ansible.builtin.apt:
        name: libapache2-mod-php
        state: present
